<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đặt mua linh kiện — Concept 4: Native Touch</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --blue:#007AFF; --red:#FF3B30; --orange:#FF9500;
  --green:#34C759; --gray:#8E8E93; --gray2:#AEAEB2; --gray5:#E5E5EA; --gray6:#F2F2F7;
  --label:#1C1C1E; --label2:#636366; --sep:rgba(60,60,67,0.22); --purple:#AF52DE;
  --star:#FF9500;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{margin:0;padding:0;background:#E5E5EA;color:var(--label);}
body{padding-bottom:40px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.2px;}

/* ---------- top control bar (prototype tooling, not part of simulated app) ---------- */
.ctrl-bar{
  position:sticky;top:0;z-index:500;background:#1C1C1E;color:#fff;
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.ctrl-bar b{font-weight:700;color:#fff;}
.ctrl-bar .grp{display:flex;align-items:center;gap:6px;}
.ctrl-bar select{background:#2C2C2E;color:#fff;border:1px solid #3A3A3C;border-radius:8px;padding:6px 8px;font-size:13px;}
.ctrl-bar label.flag{display:flex;align-items:center;gap:5px;color:#D1D1D6;cursor:pointer;}
.mode-toggle{display:flex;background:#2C2C2E;border-radius:10px;padding:3px;margin-left:auto;}
.mode-toggle button{border:none;background:transparent;color:#AEAEB2;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.mode-toggle button.active{background:var(--blue);color:#fff;}
.tag-note{background:#3A3A3C;color:#FFD60A;padding:3px 8px;border-radius:6px;font-size:11px;}

/* ---------- generic badges / kpi ---------- */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;}
.badge.orange{background:#FFF1DE;color:#B4650A;}
.badge.blue{background:#E5F2FF;color:#0060CC;}
.badge.green{background:#E3F8E9;color:#1D8A3D;}
.badge.red{background:#FFEAE9;color:#D6362A;}
.badge.gray{background:#EFEFF0;color:#636366;}
.star{color:var(--star);font-weight:700;}
.priority-row{background:linear-gradient(90deg,#FFF6E9,transparent 40%);}
.priority-row .lead-id{color:#B4650A;}

.btn{border:none;border-radius:12px;padding:9px 15px;font-size:14px;font-weight:600;background:var(--gray6);color:var(--blue);}
.btn.primary{background:var(--blue);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.btn.success{background:var(--green);color:#fff;}
.btn.ghost{background:transparent;color:var(--blue);padding:9px 6px;}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- WEB shell ---------- */
.web-wrap{max-width:1000px;margin:22px auto;padding:0 16px;}
.web-shell{background:var(--card);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.08);overflow:hidden;min-height:640px;display:flex;flex-direction:column;}
.web-header{padding:22px 26px 10px;}
.large-title{font-size:32px;font-weight:800;letter-spacing:-.4px;margin:0 0 4px;}
.web-header .subtitle{color:var(--label2);font-size:14px;margin-bottom:14px;}
.seg-scroll{overflow-x:auto;padding-bottom:2px;}
.seg{display:inline-flex;background:var(--gray6);border-radius:11px;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--label2);white-space:nowrap;}
.seg button.active{background:#fff;color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.web-toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-top:1px solid var(--sep);gap:10px;flex-wrap:wrap;}
.web-body{display:flex;flex:1;border-top:1px solid var(--sep);min-height:480px;}
.split-list{width:360px;border-right:1px solid var(--sep);overflow-y:auto;max-height:640px;flex-shrink:0;}
.split-detail{flex:1;overflow-y:auto;max-height:640px;padding:24px 28px;background:#FAFAFC;}
.full-col{flex:1;padding:24px 26px;overflow-y:auto;max-height:640px;}

/* quick filter chips */
.chip-row{display:flex;gap:8px;padding:12px 26px;flex-wrap:wrap;border-top:1px solid var(--sep);}
.chip{border:1px solid var(--gray5);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--label2);}
.chip.active{background:var(--label);color:#fff;border-color:var(--label);}
.chip.pulse{border-color:var(--orange);color:#B4650A;}

/* list rows (grouped inset style also used inline in web split list) */
.inset-group{background:#fff;border-radius:14px;margin:10px 14px;overflow:hidden;border:1px solid var(--sep);}
.row-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--sep);position:relative;background:#fff;}
.row-item:last-child{border-bottom:none;}
.row-item.selected{background:#EAF3FF;}
.row-main{flex:1;min-width:0;cursor:pointer;}
.row-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
.row-id{font-weight:700;font-size:13.5px;}
.row-sub{font-size:12.5px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-actions{display:flex;gap:6px;flex-shrink:0;}
.chevron{color:var(--gray2);font-size:16px;margin-left:2px;}
.pull-refresh{text-align:center;color:var(--gray);font-size:12px;padding:8px 0 4px;}

/* checkbox for bulk */
.cbx{width:19px;height:19px;flex-shrink:0;accent-color:var(--blue);}

.bulk-bar{display:flex;align-items:center;gap:10px;background:#0B84FF;color:#fff;padding:10px 16px;border-radius:12px;margin:8px 14px;font-size:13px;font-weight:600;}
.bulk-bar .btn{background:rgba(255,255,255,.18);color:#fff;}

/* empty state */
.empty-state{text-align:center;padding:50px 20px;color:var(--label2);}
.empty-state .ic{font-size:34px;margin-bottom:8px;}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--label2);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--gray5);border-radius:11px;font-size:14px;background:#F7F7F9;
}
.field .hint{font-size:11.5px;color:var(--gray);margin-top:4px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}

.detail-section{background:#fff;border:1px solid var(--sep);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.detail-section h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--label2);}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--sep);}
.kv:last-child{border-bottom:none;}
.kv b{font-weight:600;}
.stepper{display:flex;gap:4px;margin:10px 0 16px;flex-wrap:wrap;}
.step{flex:1;min-width:70px;text-align:center;font-size:10.5px;font-weight:700;padding:7px 4px;border-radius:8px;background:var(--gray6);color:var(--gray);}
.step.done{background:#E3F8E9;color:#1D8A3D;}
.step.now{background:var(--blue);color:#fff;}
.step.rejected{background:#FFEAE9;color:#D6362A;}

/* kpi cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.kpi-card{background:#fff;border:1px solid var(--sep);border-radius:16px;padding:16px;cursor:pointer;transition:.15s;}
.kpi-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px);}
.kpi-card .n{font-size:26px;font-weight:800;}
.kpi-card .l{font-size:12px;color:var(--label2);margin-top:2px;}
.kpi-card.warn .n{color:var(--orange);}
.kpi-card.danger .n{color:var(--red);}
.kpi-card.ok .n{color:var(--green);}
.hero-todo{background:linear-gradient(135deg,#EAF3FF,#F7EFFF);border-radius:18px;padding:20px;margin-bottom:16px;}
.hero-todo h3{margin:0 0 4px;font-size:18px;}
.hero-todo p{margin:0 0 14px;color:var(--label2);font-size:13px;}

table.pivot{width:100%;border-collapse:collapse;font-size:13px;}
table.pivot th,table.pivot td{padding:9px 10px;border-bottom:1px solid var(--sep);text-align:left;}
table.pivot th{color:var(--label2);font-weight:600;font-size:11.5px;text-transform:uppercase;}
table.pivot td.num{text-align:right;font-variant-numeric:tabular-nums;}

/* drawer (web split-view detail acts as persistent panel; also used for overlay drawer variant if needed) */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:600;display:flex;justify-content:flex-end;}
.drawer-panel{width:460px;max-width:92vw;background:#fff;height:100%;overflow-y:auto;padding:22px 24px;box-shadow:-8px 0 30px rgba(0,0,0,.15);}
.drawer-panel .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.drawer-panel .dh h2{margin:0;font-size:21px;font-weight:800;}
.x-close{border:none;background:var(--gray6);width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--label2);}

/* advanced filter panel */
.adv-panel{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:650;display:flex;justify-content:flex-end;}
.adv-inner{width:360px;max-width:92vw;background:#fff;height:100%;overflow-y:auto;padding:20px;}

/* action sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:800;display:flex;align-items:flex-end;justify-content:center;}
.action-sheet{width:100%;max-width:480px;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.action-sheet .as-title{text-align:center;font-size:12.5px;color:var(--label2);padding:8px 10px 12px;border-bottom:1px solid var(--sep);}
.action-sheet button.as-btn{display:block;width:100%;background:#F7F7F9;border:none;border-radius:12px;padding:14px;margin-top:8px;font-size:16px;font-weight:600;color:var(--blue);}
.action-sheet button.as-btn.destructive{color:var(--red);}
.action-sheet button.as-cancel{background:#fff;border:1px solid var(--gray5);color:var(--label);font-weight:700;}

/* import dialog (as sheet/drawer) */
.import-body table{width:100%;border-collapse:collapse;font-size:12.5px;margin:12px 0;}
.import-body th,.import-body td{padding:7px 8px;border-bottom:1px solid var(--sep);text-align:left;}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;z-index:900;box-shadow:0 8px 24px rgba(0,0,0,.3);}

/* ================= MOBILE PHONE FRAME ================= */
.phone-stage{display:flex;justify-content:center;padding:34px 0 60px;background:#E5E5EA;}
.phone-frame{width:390px;height:844px;border-radius:44px;background:#111;padding:12px;box-shadow:0 25px 60px rgba(0,0,0,.35),0 0 0 2px #2b2b2b;position:relative;}
.phone-screen{width:100%;height:100%;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#111;border-radius:0 0 16px 16px;z-index:50;}
.m-nav{padding:14px 18px 8px;background:rgba(242,242,247,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;transition:.15s;}
.m-nav .small-title{display:none;font-size:16px;font-weight:700;text-align:center;}
.m-nav .large-title{font-size:28px;margin:6px 0 2px;}
.m-nav.collapsed .large-title{display:none;}
.m-nav.collapsed .small-title{display:block;}
.m-content{flex:1;overflow-y:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;}
.m-seg-wrap{padding:6px 16px 4px;}
.m-body-pad{padding:0 16px;}

.tabbar{position:relative;z-index:20;display:flex;background:rgba(249,249,251,.94);backdrop-filter:blur(10px);border-top:1px solid var(--sep);padding:6px 4px 10px;}
.tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gray);font-size:10px;font-weight:600;padding:4px 0;}
.tabbar button .ic{font-size:21px;line-height:1;}
.tabbar button.active{color:var(--blue);}

.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--sep);position:relative;overflow:hidden;}
.mrow:last-child{border-bottom:none;}
.mrow-main{flex:1;min-width:0;}
.mrow-main .row-top{margin-bottom:3px;}
.swipe-actions{display:none;gap:0;flex-shrink:0;}
.mrow.swiped .swipe-actions{display:flex;}
.mrow.swiped .mrow-main{display:none;}
.swipe-actions button{border:none;color:#fff;font-size:11.5px;font-weight:700;padding:0 14px;height:56px;margin:-12px 0;}
.swipe-actions button.act-approve{background:var(--green);}
.swipe-actions button.act-reject{background:var(--red);}
.swipe-actions button.act-more{background:var(--gray);}
.mrow .grip{color:var(--gray2);font-size:18px;padding:4px 2px;flex-shrink:0;}

.bsheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:60;display:flex;align-items:flex-end;border-radius:34px;overflow:hidden;}
.bsheet{width:100%;max-height:92%;background:#fff;border-radius:20px 20px 0 0;overflow-y:auto;padding:10px 18px 26px;}
.bsheet .handle{width:36px;height:5px;background:var(--gray5);border-radius:3px;margin:6px auto 12px;}
.bsheet .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.bsheet .dh h2{margin:0;font-size:20px;font-weight:800;}

.m-asheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:90;display:flex;align-items:flex-end;border-radius:34px;overflow:hidden;}
.m-asheet-overlay .action-sheet{border-radius:16px;margin:0 8px 8px;}

.more-overlay{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:70;display:flex;align-items:flex-end;border-radius:34px;overflow:hidden;}
.more-sheet{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:10px 10px 24px;}
.more-sheet .handle{width:36px;height:5px;background:var(--gray5);border-radius:3px;margin:6px auto 14px;}
.more-item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid var(--sep);font-size:15px;font-weight:600;}
.more-item .ic{font-size:19px;width:24px;text-align:center;}

.fab-add{position:absolute;right:16px;bottom:78px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;border:none;box-shadow:0 6px 16px rgba(0,122,255,.4);z-index:15;}

.mkpi{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.mkpi .kpi-card{min-width:118px;flex-shrink:0;}

@media (max-width:1040px){.web-wrap{max-width:98vw;}}
</style>
</head>

function scopedDonHang(loai){
  let arr = DATA.donHang.filter(function(d){ return d.loai===loai; });
  const pid = S.personaId;
  if(pid==="admin"||pid==="kho"||pid==="ketoan"||pid==="tacnghiep"||pid==="tpdvbh") return arr;
  if(pid==="gs") return arr.filter(function(d){ return d.emailGs===meEmail(); });
  if(pid==="tram") return arr.filter(function(d){ return d.nguoiTao===meEmail() || d.tram===meEmail(); });
  if(pid==="ktv"||pid==="vetinh") return arr.filter(function(d){ return d.nguoiTao===meEmail(); });
  return [];
}
function scopedThieuLk(){
  let arr = DATA.thieuLk.slice();
  const pid = S.personaId;
  if(pid==="admin"||pid==="kho"||pid==="tacnghiep") return arr;
  if(pid==="gs") return arr.filter(function(t){ return t.emailGsDonGoc===meEmail(); });
  if(["tram","ktv","vetinh","ketoan","tpdvbh"].indexOf(pid)!==-1) return arr.filter(function(t){ return t.nguoiTaoTicket===meEmail(); });
  return [];
}
function scopedPxk(){
  let arr = DATA.pxk.slice();
  const pid = S.personaId;
  if(pid==="admin"||pid==="kho"||pid==="ketoan"||pid==="tacnghiep") return arr;
  if(pid==="gs") return arr.filter(function(p){ return p.emailGs===meEmail(); });
  if(pid==="tram"){
    const vt = DATA.ktvList.filter(function(k){ return k.tramCha===meEmail(); }).map(function(k){return k.email;});
    return arr.filter(function(p){ return p.nguoiNhanHang===meEmail() || vt.indexOf(p.nguoiNhanHang)!==-1; });
  }
  if(pid==="ktv"||pid==="vetinh") return arr.filter(function(p){ return p.nguoiNhanHang===meEmail(); });
  return [];
}

/* ============================== 2/3. MUA HÀNG / CÔNG NỢ (dùng chung engine) ============================== */
function donQuickFilterKey(){ return S.quickFilter["donlist"] || "all"; }
function applyDonQuick(list, key){
  if(key==="cho-toi") return list.filter(function(d){ return donActionForRole(d)!==null; });
  if(key==="uu-tien") return list.filter(function(d){ return d.uuTien; });
  if(key==="qua-han") return list.filter(function(d){ return QUA_HAN.has(d.id); });
  return list;
}
function applyDonAdv(list){
  const f = S.advFilter;
  if(f.ktv) list = list.filter(function(d){ return d.nguoiTao===f.ktv; });
  if(f.maLk) list = list.filter(function(d){ return d.maLk===f.maLk; });
  if(f.gs) list = list.filter(function(d){ return d.emailGs===f.gs; });
  return list;
}
function renderDonList(loai){
  const screenId = loai==="mua" ? "mua-hang" : "cong-no";
  let list = scopedDonHang(loai);
  list = applyDonAdv(list);
  const qf = donQuickFilterKey();
  const filtered = applyDonQuick(list, qf);
  const bulkKey = "don-"+loai;
  const selSet = S.bulkSel[bulkKey] || {};
  const bulkOn = list.some(function(d){ return donActionForRole(d)!==null; });

  let chips = quickChips("donlist", [
    {key:"all", label:"Tất cả"},
    {key:"cho-toi", label:"Chờ tôi duyệt"},
    {key:"uu-tien", label:"Ưu tiên ⭐"},
    {key:"qua-han", label:"Quá hạn"},
  ]);

  let selectedCount = Object.keys(selSet).filter(function(k){return selSet[k];}).length;
  let bulkBar = "";
  if(bulkOn && selectedCount>0){
    bulkBar = '<div class="bulk-bar">Đã chọn '+selectedCount+' đơn'+
      '<button class="btn sm" onclick="App.bulkDon(\''+bulkKey+'\',\''+loai+'\',\'approve\')">Duyệt hàng loạt</button>'+
      '<button class="btn sm" onclick="App.bulkDon(\''+bulkKey+'\',\''+loai+'\',\'reject\')">Từ chối hàng loạt</button>'+
      '</div>';
  }

  let rows = filtered.map(function(d){ return donRow(d, bulkKey, bulkOn); }).join("");
  if(!filtered.length) rows = emptyState("Không có đơn hàng nào khớp bộ lọc.");

  let toolbar = '<div class="btn-row" style="padding:0 26px 4px;">'+
    '<button class="btn" onclick="App.toggleAdv(true)">🔎 Lọc thêm</button>'+
    (canCreateDon() ? '<button class="btn primary" onclick="App.openImport(\'donHang\')">⇪ Nhập Excel</button>' : '')+
    '</div>';

  const selectedId = S.selected[screenId];
  const detail = selectedId ? renderDonDetail(donById(selectedId), filtered, screenId, true) : detailPlaceholder("Chọn 1 đơn ở danh sách bên trái để xem chi tiết.");

  if(S.mode==="web"){
    return chips + toolbar + '<div class="web-body">'+
      '<div class="split-list">'+bulkBar+'<div class="pull-refresh">↓ Kéo để làm mới</div><div class="inset-group">'+rows+'</div></div>'+
      '<div class="split-detail">'+detail+'</div>'+
    '</div>';
  }
  return chips + toolbar + bulkBar + '<div class="pull-refresh">↓ Kéo để làm mới</div><div class="inset-group">'+rows+'</div>';
}
function donRow(d, bulkKey, bulkOn){
  const li = lk(d.maLk);
  const act = donActionForRole(d);
  const selSet = S.bulkSel[bulkKey]||{};
  const checked = !!selSet[d.id];
  let quickBtn = "";
  if(act) quickBtn = '<button class="btn sm success" onclick="event.stopPropagation();App.quickApproveDon(\''+d.id+'\')">'+esc(act.label)+'</button>';
  const cbx = bulkOn ? '<input type="checkbox" class="cbx" '+(checked?"checked":"")+' onclick="event.stopPropagation();App.toggleBulk(\''+bulkKey+'\',\''+d.id+'\')">' : "";
  if(S.mode==="mobile"){
    const swiped = S.swipedRow===("don:"+d.id);
    return '<div class="mrow '+(swiped?"swiped":"")+' '+(d.uuTien?"priority-row":"")+'">'+
      '<div class="mrow-main" onclick="App.openDrawer(\'don\',\''+d.id+'\')">'+
        '<div class="row-top"><span class="row-id '+(d.uuTien?"lead-id":"")+'">'+starTag(d.uuTien)+' '+d.id+'</span>'+badge(d.trangThai)+quaHanTag(d.id)+'</div>'+
        '<div class="row-sub">'+esc(who(d.nguoiTao))+' · '+esc(li?li.ten:d.maLk)+' × '+d.soLuong+'</div>'+
      '</div>'+
      (act?'<div class="grip" onclick="App.toggleSwipe(\'don:'+d.id+'\')">⋮</div>':'')+
      '<div class="swipe-actions">'+(act?'<button class="act-approve" onclick="App.quickApproveDon(\''+d.id+'\')">'+esc(act.label)+'</button><button class="act-reject" onclick="App.openRejectDon(\''+d.id+'\')">Từ chối</button>':'')+'</div>'+
    '</div>';
  }
  return '<div class="row-item '+(d.uuTien?"priority-row":"")+' '+(S.selected[d.loai==="mua"?"mua-hang":"cong-no"]===d.id?"selected":"")+'">'+cbx+
    '<div class="row-main" onclick="App.selectRow(\''+(d.loai==="mua"?"mua-hang":"cong-no")+'\',\''+d.id+'\')">'+
      '<div class="row-top"><span class="row-id '+(d.uuTien?"lead-id":"")+'">'+starTag(d.uuTien)+' '+d.id+'</span>'+badge(d.trangThai)+quaHanTag(d.id)+'</div>'+
      '<div class="row-sub">'+esc(who(d.nguoiTao))+' · '+esc(li?li.ten:d.maLk)+' × '+d.soLuong+'</div>'+
    '</div>'+
    '<div class="row-actions">'+quickBtn+'<span class="chevron">›</span></div>'+
  '</div>';
}
function renderDonDetail(d, listCtx, screenId, embedded){
  if(!d) return detailPlaceholder("Không tìm thấy đơn.");
  const li = lk(d.maLk);
  const act = donActionForRole(d);
  const idx = listCtx.findIndex(function(x){return x.id===d.id;});
  const nextItem = idx>=0 ? listCtx[idx+1] : null;

  let steps = ["Cho Tram duyet","Cho TBP xac nhan","Cho TN duyet","TN da duyet"];
  let stepHtml = steps.map(function(s){
    let cls = "step";
    if(d.trangThai==="Tu choi"||d.trangThai==="Da huy") cls += (s==="TN da duyet"?" rejected":"");
    else if(steps.indexOf(d.trangThai) > steps.indexOf(s)) cls += " done";
    else if(d.trangThai===s) cls += " now";
    return '<div class="'+cls+'">'+STATUS_META[s].l+'</div>';
  }).join("");

  let actions = '<div class="btn-row">';
  if(act) actions += '<button class="btn success" onclick="App.approveNext(\'don\',\''+d.id+'\',\''+screenId+'\')">Duyệt và tiếp theo →</button>';
  if(act) actions += '<button class="btn danger" onclick="App.openRejectDon(\''+d.id+'\')">Từ chối</button>';
  if(canHuyDon(d) && d.trangThai!=="Da huy" && d.trangThai!=="Tu choi") actions += '<button class="btn ghost" onclick="App.huyDon(\''+d.id+'\')">Hủy đơn</button>';
  actions += '</div>';

  return ''+
  (embedded?'':'<div class="dh"><h2>'+d.id+'</h2><button class="x-close" onclick="App.closeDrawer()">✕</button></div>')+
  (embedded?'<div class="dh"><div style="font-size:20px;font-weight:800;">'+starTag(d.uuTien)+' '+d.id+'</div>'+badge(d.trangThai)+'</div>':'')+
  '<div class="stepper">'+stepHtml+'</div>'+
  '<div class="detail-section"><h4>Thông tin đơn</h4>'+
    '<div class="kv"><span>Loại</span><b>'+(d.loai==="mua"?"Mua hàng":"Công nợ")+'</b></div>'+
    '<div class="kv"><span>Người tạo</span><b>'+esc(who(d.nguoiTao))+'</b></div>'+
    '<div class="kv"><span>GS phụ trách</span><b>'+esc(who(d.emailGs))+'</b></div>'+
    '<div class="kv"><span>Linh kiện</span><b>'+esc(li?li.ten:d.maLk)+' ('+d.maLk+')'+(li&&li.dacThu?' · <span class="badge orange">Đặc thù</span>':'')+'</b></div>'+
    '<div class="kv"><span>Số lượng</span><b>'+d.soLuong+'</b></div>'+
    '<div class="kv"><span>Đơn giá / Thành tiền</span><b>'+(li?money(li.gia)+' / '+money(li.gia*d.soLuong):"—")+'</b></div>'+
    '<div class="kv"><span>Ưu tiên</span><b>'+(d.uuTien?'⭐ Có':'Không')+'</b></div>'+
    (d.lyDoCham?'<div class="kv"><span>Lý do chậm</span><b>'+esc((DATA.lyDoCham.find(function(x){return x.ma===d.lyDoCham;})||{}).ten||d.lyDoCham)+'</b></div>':"")+
  '</div>'+
  '<div class="detail-section"><h4>Mã yêu cầu sự cố (case)</h4>'+
    '<div class="kv"><span>Mã gắn</span><b>'+(d.maCase?esc(d.maCase):"Chưa gắn")+'</b></div>'+
    (canGanCase(d)?'<div class="btn-row" style="margin-top:8px;"><button class="btn sm" onclick="App.ganCase(\''+d.id+'\')">Gắn mã case</button>'+(d.maCase?'<button class="btn sm ghost" onclick="App.goCase(\''+d.id+'\')">Gỡ mã case</button>':'')+'</div>':'')+
  '</div>'+
  '<div class="detail-section"><h4>Hành động</h4>'+actions+
    (canSuaDon(d)?'<div style="margin-top:10px;font-size:12px;color:var(--label2);">Bạn có quyền sửa đơn này khi còn ở bước chờ duyệt.</div>':'')+
  '</div>';
}

function renderThDetail(t, listCtx, embedded, readOnly){
  if(!t) return detailPlaceholder("Không tìm thấy.");
  const act = readOnly ? null : thActionForRole(t);
  let steps = [["Cho ke toan duyet mem","D1 · KT duyệt mềm"],["Cho kho xac nhan","D2 · Kho xác nhận"],["Cho QC xac nhan","D3 · QC xác nhận"],["Cho TN duyet tong","D4 · TN duyệt tổng"],["Da duyet","Đã duyệt"]];

  let stepHtml = steps.map(function(s){

  const pid = S.personaId;
  if(pid==="qc"){
    const list = DATA.traHang.filter(function(t){ return t.trangThai==="Cho QC xac nhan"; });
    let rows = list.map(function(t){ return thRow(t); }).join("");
    if(!list.length) rows = emptyState("Không còn yêu cầu trả hàng nào chờ QC xác nhận. 🎉");

      '<div style="font-size:13px;color:var(--label2);">Đây là khu vực thay thế cho "Báo cáo pivot" — QC không có bảng thống kê toàn hệ thống, chỉ có danh sách hành động trực tiếp này.</div></div>'+
      '<div class="inset-group">'+rows+'</div>';
  }
  if(["tram","ktv","vetinh","tpdvbh"].indexOf(pid)!==-1){
    const mua = scopedDonHang("mua"), congno = scopedDonHang("cong_no");
    const all = mua.concat(congno);
    const tong = all.reduce(function(s,d){ const l=lk(d.maLk); return s+(l?l.gia*d.soLuong:0); },0);
    const cards = [
      kpiCard(all.length,"Đơn của tôi","",""),
      kpiCard(all.filter(function(d){return ["Cho Tram duyet","Cho TBP xac nhan","Cho TN duyet"].indexOf(d.trangThai)!==-1;}).length,"Đang chờ duyệt","warn",""),
      kpiCard(all.filter(function(d){return d.trangThai==="TN da duyet";}).length,"Đã duyệt","ok",""),
      kpiCard(scopedThieuLk().length,"Ticket thiếu LK của tôi","",""),
      kpiCard(scopedPxk().length,"Phiếu xuất kho của tôi","",""),
    ].join("");
    return '<div class="detail-section"><h4>Thẻ cá nhân — chỉ số liệu của bạn</h4><div style="font-size:13px;color:var(--label2);margin-bottom:6px;">Vai trò này không có quyền xem báo cáo pivot toàn hệ thống, chỉ xem thẻ tổng hợp riêng của mình.</div></div>'+
    '<div class="kpi-grid">'+cards+'</div>'+
    '<div class="detail-section"><h4>Tổng giá trị ước tính đơn của tôi</h4><div style="font-size:24px;font-weight:800;">'+money(tong)+'</div></div>';
  }
  // pivot: admin/gs/kho/ketoan/tacnghiep
  let donsInScope = scopedDonHang("mua").concat(scopedDonHang("cong_no"));
  const byOwner = {};
  donsInScope.forEach(function(d){ (byOwner[d.nguoiTao]=byOwner[d.nguoiTao]||[]).push(d); });
  let rows = Object.keys(byOwner).map(function(owner){
    const arr = byOwner[owner];
    const dangXl = arr.filter(function(d){return ["Cho Tram duyet","Cho TBP xac nhan","Cho TN duyet"].indexOf(d.trangThai)!==-1;}).length;
    const daDuyet = arr.filter(function(d){return d.trangThai==="TN da duyet";}).length;
    const tuChoi = arr.filter(function(d){return d.trangThai==="Tu choi";}).length;

/* ============================== App (public API bound to onclick=) ============================== */
window.App = {
  setPersona: function(id){ S.personaId = id; setDefaultFlags(); S.selected={}; S.drawer=null; S.screen="home"; S.mobileGroup="home"; S.bulkSel={}; render(); },
  toggleFlag: function(key, val){ S[key] = val; render(); },
  setMode: function(m){ S.mode = m; render(); },
  goScreen: function(s){ S.screen = s; S.drawer=null; render(); },
  goScreenMobile: function(s){
    const g = GROUPS.find(function(g){ return g.screens.indexOf(s)!==-1; });
    S.screen = s;
    if(g){ S.mobileGroup=g.id; if(g.id==="orders") S.ordersSub=s; if(g.id==="kho") S.khoSub=s; }
    S.moreOpen=false; S.drawer=null; render();
  },
  goGroup: function(gid){ S.mobileGroup=gid; S.moreOpen=false; const g=GROUPS.find(function(x){return x.id===gid;}); if(g) S.screen=groupFirstScreen(g); render(); },
  openMore: function(){ S.moreOpen=true; render(); },
  closeMore: function(){ S.moreOpen=false; render(); },
  setOrdersSub: function(s){ S.ordersSub=s; S.screen=s; render(); },
  setKhoSub: function(s){ S.khoSub=s; S.screen=s; render(); },
  setSettingsTab: function(t){ S.settingsTab=t; render(); },
  setQuick: function(g,k){ S.quickFilter[g]=k; render(); },
  toggleAdv: function(v){ S.advOpen=v; render(); },
  applyAdv: function(){
    S.advFilter.ktv = (document.getElementById("advKtv")||{}).value || "";
    S.advFilter.gs = (document.getElementById("advGs")||{}).value || "";
    S.advFilter.maLk = (document.getElementById("advMaLk")||{}).value || "";
    S.advOpen=false; render();
  },
  resetAdv: function(){ S.advFilter={}; S.advOpen=false; render(); },
  selectRow: function(screenId, id){ S.selected[screenId]=id; render(); },
  openDrawer: function(type, id){ S.drawer={type:type,id:id}; render(); },
  closeDrawer: function(){ S.drawer=null; render(); },
  toggleSwipe: function(key){ S.swipedRow = (S.swipedRow===key) ? null : key; render(); },
  toggleBulk: function(bulkKey, id){
    S.bulkSel[bulkKey] = S.bulkSel[bulkKey]||{};
    S.bulkSel[bulkKey][id] = !S.bulkSel[bulkKey][id];
    render();
  },
  jumpTo: function(screenId, quickKey){
    const map = {"mua-hang":"donlist","cong-no":"donlist","thieu-lk":"tlklist","tra-hang-day-du":"thlist","pxk":"pxklist"};
    if(map[screenId]) S.quickFilter[map[screenId]] = quickKey==="cho-toi"?"cho-toi":(quickKey==="uu-tien"?"uu-tien":"all");
    if(S.mode==="web"){ S.screen=screenId; }
    else { App.goScreenMobile(screenId); return; }
    render();
  },

  /* ---- Mua hàng / Công nợ actions ---- */
  quickApproveDon: function(id){ doDonAction(id); },
  approveNext: function(kind, id, screenId){
    if(kind==="don"){
      doDonAction(id);
      const list = currentListForScreen(screenId);
      const idx = list.findIndex(function(x){return x.id===id;});
      const next = list[idx+1] || list.filter(function(x){return x.id!==id;})[0];
      if(next){ S.selected[screenId]=next.id; if(S.drawer) S.drawer={type:"don",id:next.id}; }
      else { S.selected[screenId]=null; S.drawer=null; }
    } else if(kind==="thieulk"){
      doTlkAction(id);
      const list = scopedThieuLk();
      const idx = list.findIndex(function(x){return x.id===id;});
      const next = list[idx+1] || list.filter(function(x){return x.id!==id;})[0];
      if(next){ S.selected["thieu-lk"]=next.id; if(S.drawer) S.drawer={type:"thieulk",id:next.id}; }
      else { S.selected["thieu-lk"]=null; S.drawer=null; }
    } else if(kind==="trahang"){
      doThAction(id);
      const list = scopedTraHangDayDu();
      const idx = list.findIndex(function(x){return x.id===id;});
      const next = list[idx+1] || list.filter(function(x){return x.id!==id;})[0];
      if(next){ S.selected["tra-hang-day-du"]=next.id; if(S.drawer) S.drawer={type:"trahang",id:next.id}; }
      else { S.selected["tra-hang-day-du"]=null; S.drawer=null; }
    }
    render();
  },
  openRejectDon: function(id){
    S.actionSheet = { title:"Từ chối đơn "+id, message:"Chọn lý do chậm — nếu lý do có cờ tự mở ticket, hệ thống sẽ mở ticket Thiếu LK thay vì từ chối hẳn.", buttons:
      DATA.lyDoCham.map(function(l){ return { label:l.ten, style:l.moTicketThieuLk?"":"destructive", handler:function(){ doTuChoiDon(id, l.ma); } }; })
    };
    render();
  },
  huyDon: function(id){
    S.actionSheet = { title:"Hủy đơn "+id, message:"Bạn chắc chắn muốn huỷ đơn này?", buttons:[
      { label:"Xác nhận hủy đơn", style:"destructive", handler:function(){ const d=donById(id); d.trangThai="Da huy"; toast("Đã huỷ đơn "+id); } }
    ]};
    render();
  },
  ganCase: function(id){ const d=donById(id); d.maCase="YCSC-"+Math.floor(1000+Math.random()*9000); toast("Đã gắn mã case cho "+id); render(); },
  goCase: function(id){ const d=donById(id); d.maCase=null; toast("Đã gỡ mã case khỏi "+id); render(); },
  bulkDon: function(bulkKey, loai, kind){
    const sel = S.bulkSel[bulkKey]||{};
    const ids = Object.keys(sel).filter(function(k){return sel[k];});
    if(!ids.length) return;
    S.actionSheet = { title: (kind==="approve"?"Duyệt hàng loạt ":"Từ chối hàng loạt ")+ids.length+" đơn", message:"Áp dụng cho các đơn đã chọn mà bạn có quyền xử lý ở bước hiện tại.", buttons:[
      { label:"Xác nhận", style: kind==="reject"?"destructive":"", handler:function(){
        let done=0, skip=0;
        ids.forEach(function(id){
          const d = donById(id);
          if(kind==="approve"){ if(donActionForRole(d)){ doDonAction(id); done++; } else skip++; }
          else { if(donActionForRole(d)){ d.trangThai="Tu choi"; d.lyDoCham="LDC2"; done++; } else skip++; }
        });
        S.bulkSel[bulkKey] = {};
        toast("Đã xử lý "+done+" đơn"+(skip?(", bỏ qua "+skip+" đơn không đủ quyền"):""));
      }}
    ]};
    render();
  },

  /* ---- Thiếu LK actions ---- */
  quickTlk: function(id){ doTlkAction(id); render(); },
  tlkTuChoi: function(id){ const t=tlkById(id); t.trangThai="Tu choi sai thong tin"; toast("Đã từ chối ticket "+id+" (sai thông tin)"); render(); },
  tlkHuy: function(id){
    S.actionSheet = { title:"Hủy ticket "+id, buttons:[{label:"Xác nhận huỷ ticket", style:"destructive", handler:function(){ const t=tlkById(id); t.trangThai="Da huy bo"; toast("Đã huỷ ticket "+id); }}] };
    render();
  },

  /* ---- PXK actions ---- */
  pxkGanMa: function(id, kind){
    const p = pxkById(id);
    if(kind==="xk"){ p.maXuatKho="XK-"+Math.floor(90000+Math.random()*9000); toast("Đã gán mã xuất kho cho "+id); }
    else { p.maMisa="MISA-"+Math.floor(50000+Math.random()*9000); toast("Đã gán mã MISA cho "+id); }
    render();
  },
  pxkUpload: function(id, kind){ const p=pxkById(id); p.anhBienBan="anh_bienban_"+id+".jpg"; toast("Đã upload ảnh biên bản nhận hàng (giả lập)"); render(); },
  pxkTien: function(id, kind){
    const p = pxkById(id);
    if(kind==="yeucau"){ p.trangThaiTien="Cho KTV chuyen tien"; toast("Đã yêu cầu chuyển tiền cho "+id); }
    else if(kind==="xacnhan"){ p.trangThaiTien="KTV da chuyen"; p.bangChungCT="bang_chung_"+id+".jpg"; toast("Đã xác nhận chuyển tiền + đính kèm bằng chứng"); }
    else if(kind==="duyetcuoi"){ p.trangThaiTien="TN da duyet tien"; toast("Đã duyệt tiền cuối cùng cho "+id); }
    render();
  },
  pxkChuyenKeToan: function(id){ const p=pxkById(id); p.trangThai="Cho ke toan"; toast("Đã chuyển "+id+" cho kế toán"); render(); },
  pxkChotXong: function(id){ toast("Đã chốt xong đơn xuất "+id); render(); },
  pxkGuiHang: function(id){ const p=pxkById(id); p.trangThai="Dang gui KTV"; toast("Đã gửi hàng cho KTV — "+id); render(); },
  pxkKhoKetThuc: function(id){ const p=pxkById(id); p.trangThai="Kho da ket thuc"; toast("Kho đã kết thúc phiếu "+id); render(); },
  pxkXacNhanNhan: function(id){ toast("Đã xác nhận nhận hàng cho phiếu "+id); render(); },
  pxkHuy: function(id){
    S.actionSheet = { title:"Hủy phiếu "+id, buttons:[{label:"Xác nhận huỷ phiếu", style:"destructive", handler:function(){ const p=pxkById(id); p.trangThai="Dang tao phieu"; p.maXuatKho=null; p.maMisa=null; toast("Đã huỷ phiếu "+id); }}] };
    render();
  },

  /* ---- Trả hàng actions ---- */
  quickApproveTh: function(id){ doThAction(id); render(); },
  openRejectTh: function(id){
    S.actionSheet = { title:"Từ chối yêu cầu trả hàng "+id, message:"Bắt buộc ghi chú lý do (giả lập).", buttons:[
      { label:"Từ chối — Không đủ điều kiện trả hàng", style:"destructive", handler:function(){ const t=thById(id); t.trangThai="Tu choi"; toast("Đã từ chối "+id); } }
    ]};
    render();
  },
  luiBuocTh: function(id){
    const t = thById(id);
    const order = ["Cho ke toan duyet mem","Cho kho xac nhan","Cho QC xac nhan","Cho TN duyet tong"];
    const idx = order.indexOf(t.trangThai);
    if(idx>0){ t.trangThai=order[idx-1]; toast("Đã lùi bước yêu cầu trả hàng "+id); } render();
  },
  huyTh: function(id){
    S.actionSheet = { title:"Hủy yêu cầu trả hàng "+id, buttons:[{label:"Xác nhận huỷ yêu cầu", style:"destructive", handler:function(){ const t=thById(id); t.trangThai="Tu choi"; toast("Đã huỷ yêu cầu "+id); }}] };
    render();
  },

  /* ---- action sheet / import dialog plumbing ---- */
  actionSheetClick: function(i){ const b=S.actionSheet.buttons[i]; S.actionSheet=null; if(b&&b.handler) b.handler(); render(); },
  closeActionSheet: function(){ S.actionSheet=null; render(); },
  openImport: function(type){ S.importDialog=type; render(); },
  closeImport: function(){ S.importDialog=null; render(); },
  doImport: function(){
    const type = S.importDialog;
    if(type==="donHang"){
      IMPORT_SAMPLES.donHang.rows.forEach(function(r){
        DATA.donHang.push({ id:nextId("DH"), loai:"mua", nguoiTao:meEmail(), emailGs:(ktvOf(meEmail())||{}).giamSat||"gs.mienbac@3t.vn", tram:null, maLk:r[0], soLuong:r[1], trangThai:"Cho Tram duyet", uuTien:false });
      });
      toast("Đã nhập "+IMPORT_SAMPLES.donHang.rows.length+" đơn hàng từ Excel");
    } else if(type==="ktv"){
      IMPORT_SAMPLES.ktv.rows.forEach(function(r){
        DATA.ktvList.push({ email:r[0], ten:r[1], vaiTro:r[2], tramCha:null, giamSat:"gs.mienbac@3t.vn" });
      });
      toast("Đã nhập "+IMPORT_SAMPLES.ktv.rows.length+" KTV/CTV từ Excel");
    } else if(type==="linhKien"){
      IMPORT_SAMPLES.linhKien.rows.forEach(function(r){
        DATA.linhKien.push({ ma:r[0], ten:r[1], hang:r[2], gia:r[3], dacThu:false, thayThe:[] });
      });
      toast("Đã nhập "+IMPORT_SAMPLES.linhKien.rows.length+" linh kiện từ Excel");
    }
    S.importDialog=null; render();
  },

  /* ---- Tạo đơn ---- */
  tdPreviewGoiY: function(ma){
    const l = lk(ma); const el = document.getElementById("tdGoiY");
    if(el){ el.textContent = (l&&l.thayThe.length) ? ("Gợi ý thay thế: "+l.thayThe.join(", ")) : ""; }
    App.tdTinhTong();
  },
  tdTinhTong: function(){
    const maSel = document.getElementById("tdMaLk"); const slEl = document.getElementById("tdSl"); const out = document.getElementById("tdTong");
    if(!maSel||!slEl||!out) return;
    const l = lk(maSel.value); const sl = parseInt(slEl.value||"0",10);
    out.textContent = l ? money(l.gia*sl) : "—";
  },
  taoDon: function(){
    const loai = document.getElementById("tdLoai").value;
    const nguoi = document.getElementById("tdNguoi").value;
    const maLk = document.getElementById("tdMaLk").value;
    const sl = parseInt(document.getElementById("tdSl").value||"1",10);
    const uuTien = document.getElementById("tdUuTien").checked;
    const nguoiKtv = ktvOf(nguoi);
    const isVeTinh = nguoiKtv && nguoiKtv.tramCha;
    const id = nextId("DH");
    DATA.donHang.push({ id:id, loai:loai, nguoiTao:nguoi, emailGs:(nguoiKtv&&nguoiKtv.giamSat)||"gs.mienbac@3t.vn", tram: isVeTinh?nguoiKtv.tramCha:null, maLk:maLk, soLuong:sl, trangThai: isVeTinh?"Cho Tram duyet":"Cho TN duyet", uuTien:uuTien });
    toast("Đã tạo đơn "+id);
    App.goScreen(loai==="mua"?"mua-hang":"cong-no");
  },

  /* ---- Danh mục LK ---- */
  openLkForm: function(ma){
    const existing = ma ? lk(ma) : null;
    S.actionSheet = { title: ma?("Sửa "+ma):"Thêm linh kiện mới", message: "Form rút gọn cho prototype — bấm Xác nhận để lưu vào danh mục.", buttons:[
      { label: ma? "Lưu thay đổi (giả lập)" : "Thêm linh kiện mẫu mới", handler:function(){
        if(!ma){
          const newMa = "LK0"+(90+Math.floor(Math.random()*9));
          DATA.linhKien.push({ ma:newMa, ten:"Linh kiện mới ("+newMa+")", hang:"Khác", gia:100000, dacThu:false, thayThe:[] });
          toast("Đã thêm linh kiện "+newMa);
        } else { toast("Đã lưu thay đổi cho "+ma); }
      }}
    ]};
    render();
  },
  xuatAnh: function(){ toast("Đã xuất ảnh minh hoạ linh kiện (giả lập, qua Google Drive)"); },

  /* ---- Settings ---- */
  ganGs: function(email, gs){ const k=ktvOf(email); k.giamSat=gs; toast("Đã gán Giám sát phụ trách cho "+k.ten); render(); },
  gdriveToggle: function(){ GOOGLE_DRIVE.connected = !GOOGLE_DRIVE.connected; toast(GOOGLE_DRIVE.connected?"Đã kết nối Google Drive":"Đã ngắt kết nối Google Drive"); render(); },

  /* ---- Users ---- */
  duyetUser: function(email){ const u=DATA.users.find(function(x){return x.email===email;}); u.trangThaiDuyet="Da duyet"; toast("Đã duyệt tài khoản "+email); render(); },
  khoaUser: function(email){ const u=DATA.users.find(function(x){return x.email===email;}); u.khoa=!u.khoa; toast((u.khoa?"Đã khoá":"Đã mở khoá")+" tài khoản "+email); render(); },
  openUserForm: function(email){ S.drawer={type:"userform", id:email}; render(); },
  saveUserForm: function(email, isSelf){
    if(isSelf){
      const val = (document.getElementById("selfConfirmEmail")||{}).value || "";
      if(val.trim().toLowerCase() !== email.toLowerCase()){
        toast("Chưa xác nhận đúng email — vui lòng gõ lại chính xác email của bạn để lưu.");
        return;
      }
    }
    const u = DATA.users.find(function(x){return x.email===email;});
    u.vaiTro = document.getElementById("ufVaiTro").value || null;
    u.khoa = document.getElementById("ufKhoa").checked;
    S.drawer = null;
    toast("Đã lưu thay đổi cho "+email);
    render();
  },
};

/* ============================== business-logic mutators ============================== */
function doDonAction(id){
  const d = donById(id); if(!d) return;
  const act = donActionForRole(d); if(!act) return;
  if(act.key==="tram_duyet") d.trangThai = "Cho TN duyet";
  else if(act.key==="tbp_xn") d.trangThai = "Cho TN duyet";
  else if(act.key==="tn_duyet") d.trangThai = "TN da duyet";
  toast(act.label+" thành công — "+id);
}
function doTuChoiDon(id, lyDoMa){
  const d = donById(id); const lydo = DATA.lyDoCham.find(function(x){return x.ma===lyDoMa;});
  if(lydo && lydo.moTicketThieuLk){
    const ticketId = nextId("TLK");
    DATA.thieuLk.push({ id:ticketId, donGoc:d.id, nguoiTaoTicket: meEmail(), emailGsDonGoc: d.emailGs, maLk:d.maLk, trangThai:"Cho kho tiep nhan", uuTien:d.uuTien });
    d.trangThai = "Cho TN duyet"; d.lyDoCham = lyDoMa;
    toast("Lý do có cờ mở ticket — đã tự tạo ticket Thiếu LK "+ticketId+" thay vì từ chối hẳn đơn "+id);
  } else {
    d.trangThai = "Tu choi"; d.lyDoCham = lyDoMa;
    toast("Đã từ chối đơn "+id);
  }
  render();
}
function doTlkAction(id){
  const t = tlkById(id); if(!t) return;
  const act = tlkActionForRole(t); if(!act) return;
  if(act.key==="kho_tiep_nhan") t.trangThai="Kho da tiep nhan";
  else if(act.key==="kho_xac_nhan_ve") t.trangThai="Da ve kho";
  else if(act.key==="dong_ticket") t.trangThai="Da ket thuc";
  toast(act.label+" thành công — "+id);
}
function doThAction(id){
  const t = thById(id); if(!t) return;
  const act = thActionForRole(t); if(!act) return;
  if(act.key==="d1") t.trangThai="Cho kho xac nhan";
  else if(act.key==="d2") t.trangThai="Cho QC xac nhan";
  else if(act.key==="d3") t.trangThai="Cho TN duyet tong";
  else if(act.key==="d4") t.trangThai="Da duyet";
  toast(act.label+" thành công — "+id);
}

/* ============================== init ============================== */
render();
})();
</script>
</body>
</html>
