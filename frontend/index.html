<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-37.png" />
    <!-- PWA / "Cài lên màn hình chính" (hang muc #1, 2026-08-25) - display:"standalone" (khong dung
         "fullscreen" vi se an ca status bar he dieu hanh, qua aggressive so voi y "full man hinh app"
         thong thuong). Icon RIENG cho web linh kien (logo-37.png qua nho/khong vuong, khong dung lam
         icon PWA duoc) - xem frontend/public/icon-*.png. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#06304a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Đặt mua linh kiện - Dịch Vụ 3T</title>
    <!-- Chong nhay mau mac dinh (FOUC) cho tinh nang "Giao diện" ca nhan (xem
         frontend/src/theme/useThemeSettings.ts) - doc thang "resolvedVars"/"fontCssValue" da tinh
         san trong localStorage (KHONG nhung lai logic HSL/resolveTheme sang JS thuan o day) va set
         truoc khi React mount. Neu chua tung mo thẻ cai dat (localStorage rong) thi khong lam gi ca -
         giao dien giu nguyen y het tokens.css mac dinh. Boc try/catch vi localStorage co the bi chan
         (che do rieng tu/policy trinh duyet). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("theme-settings-v1");
          if (!raw) return;
          var s = JSON.parse(raw);
          var root = document.documentElement.style;
          if (s.resolvedVars) {
            for (var k in s.resolvedVars) root.setProperty("--" + k, s.resolvedVars[k]);
          }
          if (s.fontCssValue) root.setProperty("--font-body", s.fontCssValue);
          if (s.resolvedVars && s.resolvedVars["ocean-900"]) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", s.resolvedVars["ocean-900"]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
